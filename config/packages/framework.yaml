framework:
    secret: '%env(APP_SECRET)%'
    # Cookie de session : inaccessible au JavaScript, envoyé en HTTPS, jamais depuis un autre site
    session:
        cookie_httponly: true
        cookie_secure: auto
        cookie_samesite: lax
    mailer:
        dsn: '%env(MAILER_DSN)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
