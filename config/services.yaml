# Numéro de version de l'application (MAJEUR.MINEUR.CORRECTIF), affiché en pied de page
parameters:
    version_application: '1.0.0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude: '../src/{Kernel.php,Security/Utilisateur.php}'

    # Connexion à la base, partagée par tous les services
    PDO:
        class: PDO
        arguments: ['%env(DATABASE_DSN)%', '%env(DATABASE_USER)%', '%env(DATABASE_PASSWORD)%']
